<!--
div{}:
This rule targets all <div> elements and sets their size:
height: 200px; → The div will be 200 pixels tall.
width: 200px; → The div will be 200 pixels wide.
So it creates a square box of 200×200 pixels.
Example:
<style>
  div {
    height: 200px;
    width: 200px;
    background-color: lightblue;
  }
</style>
<div></div>

p { margin: 0; } mean?
This CSS rule targets all <p> (paragraph) elements and removes their default margin.
🔹 Why do we use it?
Browsers automatically add top and bottom margins to paragraphs — usually around 16px.
This spacing can interfere with layout, especially when you're designing tight sections like cards, headers, or footers.
By setting margin: 0;, you're saying:
📦 Example
html
<style>
  p {
    margin: 0;
  }
</style>

<p>This is a paragraph.</p>
<p>This is another one.</p>
Without margin: 0;, there would be space between the two paragraphs. With it, they sit flush together.
🧠 Teaching Analogy
Imagine paragraphs are like books on a shelf. The browser adds padding between each book. margin: 0; says:
“Push the books close together — I’ll decide later how much space I want.”
